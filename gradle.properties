#Sat Mar 12 05:53:50 MSK 2016
APP_VERSION_CODE=7038
APP_VERSION_NAME=12.10.1
APP_PACKAGE=com.kazum0ra.mytelegram
IS_PRIVATE=false
RELEASE_KEY_PASSWORD=android
RELEASE_KEY_ALIAS=androidkey
RELEASE_STORE_PASSWORD=android
org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=1g
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
android.useAndroidX=true
android.enableJetifier=true
android.defaults.buildfeatures.buildconfig=true
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.enableR8.fullMode=true

# ── Форк MyTelegram ──────────────────────────────────────────────
# ABI, які збираємо. Нативна частина (boringssl, tgnet, voip, tde2e)
# компілюється окремо під кожну архітектуру, тож кожен зайвий ABI —
# це ще один повний прохід CMake. arm64-v8a покриває практично всі
# телефони, випущені після ~2018.
# Щоб зібрати під усі: ./gradlew -PTARGET_ABIS=armeabi-v7a,arm64-v8a,x86,x86_64 ...
TARGET_ABIS=arm64-v8a
