name: Build debug APK

on:
  push:
    branches:
      - feature/ai-panel
  pull_request:
  workflow_dispatch:
    inputs:
      abis:
        description: 'ABI для збірки (через кому)'
        required: false
        default: 'arm64-v8a'

# Новий пуш скасовує попередню незавершену збірку тієї ж гілки —
# нативна частина довга, немає сенсу тримати дві паралельно.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  NDK_VERSION: '27.2.12479018'
  CMAKE_VERSION: '3.22.1'
  # Явно, щоб шлях у кроках cache і в самому ccache гарантовано збігався
  CCACHE_DIR: /home/runner/.cache/ccache

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    # Потрібне, щоб крок публікації міг створити/оновити реліз із APK.
    permissions:
      contents: write

    steps:
      # Раннер приватного репозиторію має ~14 ГБ диска. NDK (~3 ГБ),
      # SDK, boringssl і об'єктні файли CMake туди ледве влазять,
      # тож прибираємо передвстановлене, чим не користуємось.
      - name: Звільнити місце на диску
        run: |
          echo "До:"; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          echo "Після:"; df -h / | tail -1

      # fetch-depth: 1 — без цього тягнеться ~700 МБ історії, яка збірці
      # не потрібна.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false

      # Ініціалізуємо ЛИШЕ ті підмодулі, без яких не збереться:
      #   jlatexmath      — окремий Gradle-модуль (settings.gradle)
      #   tlottie         — заголовки до prebuild/<abi>/libtlottie.a
      #   libyuv, xiph/*  — CMake компілює їхні сирці
      #   openh264        — .a теж зібраний наперед, АЛЕ webrtc-код тягне
      #                     його заголовки: h264_encoder_impl.h включає
      #                     third_party/openh264/codec/api/wels/codec_app_def.h,
      #                     а сам h264_encoder_impl.cc є в voip/CMakeLists.txt
      #
      # НЕ ініціалізуємо (перевірено, збірці не потрібні):
      #   ffmpeg  — заголовки лежать у дереві, в jni/ffmpeg/include
      #   dav1d   — єдиний його споживач, dav1d_decoder.cc, закоментований
      #             у voip/CMakeLists.txt
      #   libvpx  — vpx/*.h трапляються лише в *_unittest.cc, які не збираються
      # Разом це економить ~1 ГБ клонування і кілька хвилин на кожному запуску.
      - name: Ініціалізувати потрібні підмодулі
        run: |
          git submodule update --init --depth 1 --recommend-shallow \
            TMessagesProj/lib/jlatexmath \
            TMessagesProj/jni/tlottie \
            TMessagesProj/jni/third_party/libyuv \
            TMessagesProj/jni/third_party/openh264 \
            TMessagesProj/jni/third_party/xiph/ogg \
            TMessagesProj/jni/third_party/xiph/opus \
            TMessagesProj/jni/third_party/xiph/opusfile
          git submodule status

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: NDK ${{ env.NDK_VERSION }} + CMake ${{ env.CMAKE_VERSION }}
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;${NDK_VERSION}" \
            "cmake;${CMAKE_VERSION}"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/feature/ai-panel' }}

      - name: Встановити ccache
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ccache
          ccache --max-size=3G
          ccache --zero-stats

      # Кешуємо саме ccache, а не .cxx: ccache зіставляє файли за хешем
      # вмісту, тож переживає checkout, де всі mtime свіжі.
      # restore/save роздільні навмисно — save з `if: always()` зберігає
      # кеш навіть коли збірка впала, і наступний запуск не компілює
      # заново те, що вже встигло зібратись.
      - name: Відновити кеш ccache
        uses: actions/cache/restore@v4
        id: ccache-restore
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ env.NDK_VERSION }}-

      - name: Збірка debug APK
        env:
          # Ключі з my.telegram.org. Лежать у Settings -> Secrets and
          # variables -> Actions. У код і в логи не потрапляють.
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          ABIS="${{ github.event.inputs.abis || 'arm64-v8a' }}"
          echo "Збираю під: $ABIS"
          # -Dorg.gradle.jvmargs перекриває -Xmx8g із gradle.properties:
          # раннер має лише ~7 ГБ RAM і з 8 ГБ heap Gradle не стартує.
          ./gradlew :TMessagesProj_App:assembleAfatDebug \
            -PTARGET_ABIS="$ABIS" \
            -PUSE_CCACHE \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --max-workers=2 \
            --stacktrace \
            --no-daemon

      - name: Статистика ccache
        if: always()
        run: ccache --show-stats

      - name: Зберегти кеш ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/ccache
          key: ccache-${{ runner.os }}-${{ env.NDK_VERSION }}-${{ github.sha }}

      - name: Знайти APK
        id: apk
        run: |
          FOUND=$(find TMessagesProj_App -name "*.apk" -path "*afat*" | head -1)
          echo "Знайдено: $FOUND"
          ls -lh "$FOUND"
          echo "path=$FOUND" >> "$GITHUB_OUTPUT"

      # APK віддаємо релізом, а не артефактом Actions: активи релізів не
      # входять у квоту сховища артефактів (500 МБ на безкоштовному плані,
      # її ми вже вичерпали), плюс посилання стале — зручно відкривати
      # прямо з телефона.
      #
      # Тег debug-latest «ковзний»: щоразу видаляємо і створюємо наново,
      # щоб він указував на свіжий коміт, а URL не змінювався.
      - name: Опублікувати APK у релізі debug-latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHORT="$(git rev-parse --short HEAD)"
          NAME="mytelegram-debug-${SHORT}.apk"
          cp "${{ steps.apk.outputs.path }}" "$NAME"
          ls -lh "$NAME"

          {
            echo "Неофіційна debug-збірка MyTelegram. Не для поширення."
            echo
            echo "- Коміт: \`$GITHUB_SHA\`"
            echo "- ABI: \`${{ github.event.inputs.abis || 'arm64-v8a' }}\`"
            echo "- Зібрано: $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo
            echo "Встановлюється поруч з офіційним Telegram: package name інший"
            echo "(\`com.kazum0ra.mytelegram.beta\`), конфлікту провайдерів немає."
          } > release-notes.md

          gh release delete debug-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create debug-latest "$NAME" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build $SHORT" \
            --notes-file release-notes.md

          echo "Готово: $(gh release view debug-latest --json url -q .url)"

      # Якщо збірка впала — логи CMake кажуть значно більше, ніж вивід Gradle.
      - name: Логи нативної збірки (при падінні)
        if: failure()
        run: |
          find TMessagesProj/.cxx -name "*.log" -o -name "CMakeError.log" \
            -o -name "CMakeOutput.log" 2>/dev/null | head -20 | while read f; do
              echo "===== $f ====="; tail -80 "$f"
          done
